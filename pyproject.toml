[project]
name = "home-automation"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "Jinja2==3.1.6",
    "PyYAML==6.0.3",
    "pyrefly==1.4.0",
    "pytest==9.1.1",
    "ruff==0.17.1",
    "yamllint==1.38.0",
]
firmware = ["esphome==2026.9.1"]

[tool.uv]
package = false

# The bridge runs on the Python 3.12 shipped with Venus OS v3.81 (stdlib only);
# development and firmware tooling is pinned to a bounded range.
[tool.uv.dependency-groups]
dev = { requires-python = ">=3.12,<3.15" }
firmware = { requires-python = ">=3.12,<3.15" }

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "ANN"]

[tool.ruff.lint.per-file-ignores]
"venus-os/mqtt-grid-meter/test_mqtt_grid_meter.py" = ["E402"]

[tool.pyrefly]
project-includes = ["venus-os/mqtt-grid-meter", "tools", "tests", "homeassistant/tests"]
search-path = ["venus-os/mqtt-grid-meter"]
python-version = "3.12"
python-platform = "linux"
skip-interpreter-query = true
ignore-missing-imports = ["dbus.*", "gi", "gi.*", "vedbus", "yaml", "jinja2.*"]

[tool.pytest.ini_options]
testpaths = ["venus-os/mqtt-grid-meter", "homeassistant/tests", "tests"]
