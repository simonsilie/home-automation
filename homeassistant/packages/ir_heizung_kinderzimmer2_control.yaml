# Home Assistant package: IR-Heizung Kinderzimmer 2 surplus control.
# Battery charging has priority; Venus OS / BMS still own ESS regulation.
# Configure the heater's rated power before enabling automatic control.
# Battery-power polarity is unchanged: this package assumes + = discharge.

input_boolean:
  ir_kz2_surplus_control_enabled:
    name: "IR-Heizung Kinderzimmer 2 Ueberschussregelung"
    icon: mdi:solar-power
    initial: false

input_number:
  ir_kz2_heater_power:
    name: "IR-Heizung Kinderzimmer 2 Nennleistung"
    icon: mdi:radiator
    min: 0
    max: 4000
    step: 10
    unit_of_measurement: W
    mode: box
    # Zero prevents automatic heating until the actual wattage is configured.

# Qualification resets on restart/reload and whenever any prerequisite is lost.
template:
  - binary_sensor:
      - name: "IR KZ2 Surplus Ready"
        unique_id: ir_kz2_surplus_ready
        delay_on:
          seconds: 60
        state: >
          {% set grid = states('sensor.grid_power_average') %}
          {% set soc = states('sensor.gx_device_dc_batterieladung') %}
          {% set battery = states('sensor.gx_device_dc_batterieleistung') %}
          {% set heater_power = states('input_number.ir_kz2_heater_power') | float(0) %}
          {{ is_state('input_boolean.ir_kz2_surplus_control_enabled', 'on')
             and is_state('climate.ir_heizung_kinderzimmer_2', 'off')
             and is_number(states('sensor.0xe406bffffedb6d41_temperature'))
             and is_number(grid) and is_number(soc) and is_number(battery)
             and heater_power > 0
             and grid | float(0) < -(heater_power + 300)
             and soc | float(0) > 98.9
             and battery | float(0) <= 0 }}

      - name: "IR KZ2 Surplus Stop"
        unique_id: ir_kz2_surplus_stop
        state: >
          {% set grid = states('sensor.grid_power_average') %}
          {% set soc = states('sensor.gx_device_dc_batterieladung') %}
          {% set battery = states('sensor.gx_device_dc_batterieleistung') %}
          {{ not is_number(grid) or not is_number(soc) or not is_number(battery)
             or not is_number(states('sensor.0xe406bffffedb6d41_temperature'))
             or states('input_number.ir_kz2_heater_power') | float(0) <= 0
             or grid | float(0) >= -100
             or soc | float(0) < 97
             or battery | float(0) > 0 }}

automation:
  - id: ir_kz2_surplus_einschalten
    alias: "IR-Heizung Kinderzimmer 2 Ueberschussregelung"
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.ir_kz2_surplus_ready
        to: "on"
      - trigger: state
        entity_id: binary_sensor.ir_kz2_surplus_stop
        to: "on"
      - trigger: state
        entity_id: input_boolean.ir_kz2_surplus_control_enabled
        id: control_toggle
      - trigger: state
        entity_id: climate.ir_heizung_kinderzimmer_2
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        seconds: "/30"
    actions:
      - choose:
          # Toggle transitions switch off once; enabling must qualify from HVAC off.
          - conditions: >
              {{ trigger.id == 'control_toggle'
                 and states('input_boolean.ir_kz2_surplus_control_enabled') in ['on', 'off'] }}
            sequence:
              - action: climate.set_hvac_mode
                target:
                  entity_id: climate.ir_heizung_kinderzimmer_2
                data:
                  hvac_mode: "off"
          - conditions: >
              {{ trigger.id != 'control_toggle'
                 and is_state('input_boolean.ir_kz2_surplus_control_enabled', 'on')
                 and not is_state('binary_sensor.ir_kz2_surplus_stop', 'off')
                 and is_state('climate.ir_heizung_kinderzimmer_2', 'heat') }}
            sequence:
              - action: climate.set_hvac_mode
                target:
                  entity_id: climate.ir_heizung_kinderzimmer_2
                data:
                  hvac_mode: "off"
          - conditions: >
              {{ trigger.id != 'control_toggle'
                 and is_state('input_boolean.ir_kz2_surplus_control_enabled', 'on')
                 and is_state('binary_sensor.ir_kz2_surplus_stop', 'off')
                 and is_state('binary_sensor.ir_kz2_surplus_ready', 'on')
                 and is_state('climate.ir_heizung_kinderzimmer_2', 'off') }}
            sequence:
              - action: climate.set_temperature
                target:
                  entity_id: climate.ir_heizung_kinderzimmer_2
                data:
                  hvac_mode: heat
                  temperature: 21.5
