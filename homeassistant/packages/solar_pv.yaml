# Home Assistant package: solar PV template and aggregation sensors.
#
# Aggregates solar generation across the existing Hoymiles (OpenDTU) microinverters
# and the APsystems EZ1-M microinverter.

template:
  - sensor:
      - name: "Solar Power Total"
        unique_id: solar_power_total
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {% set opendtu = states('sensor.opendtu_91fd98_ac_power') %}
          {% set ez1 = states('sensor.ez1_total_power') %}
          {% if is_number(opendtu) and is_number(ez1) %}
            {{ (opendtu | float + ez1 | float) | round(1) }}
          {% else %}
            {{ none }}
          {% endif %}
        availability: >
          {{ is_number(states('sensor.opendtu_91fd98_ac_power'))
             and is_number(states('sensor.ez1_total_power')) }}
