name: Configuration checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.13.0"
      - run: uv sync --locked --group firmware
      - run: uv run --locked ruff check venus-os/mqtt-grid-meter homeassistant/tests tools tests
      - run: uv run --locked ruff format --check venus-os/mqtt-grid-meter homeassistant/tests tools tests
      - run: uv run --locked pyrefly check
      - run: uv run --locked pytest
      - run: uv run --locked yamllint homeassistant esphome .github
      - run: uv run --locked --group firmware python tools/validate_esphome.py
      - name: Check service shell syntax
        run: >-
          sh -n venus-os/mqtt-grid-meter/install.sh
          venus-os/mqtt-grid-meter/boot.sh
          venus-os/mqtt-grid-meter/service/run
          venus-os/mqtt-grid-meter/service/log/run

  bridge-python312:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Test bridge without development or Venus OS dependencies
        run: python -B -m unittest discover -s venus-os/mqtt-grid-meter -p 'test_*.py' -v
