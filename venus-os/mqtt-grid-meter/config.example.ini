[mqtt]
# Use a broker DNS name present in its certificate's subjectAltName.
# Replace this example with your broker's certificate hostname.
host = mqtt.example.com
# Configure a verified TLS listener on the broker before enabling this example.
# Existing configs without tls retain plaintext; legacy LAN-only opt-in: tls = false, port = 1883.
tls = true
port = 8883
# Empty uses system trusted CAs. For a private CA, set the PEM CA file path on the Cerbo,
# e.g. /data/etc/mqtt-grid-meter/broker-ca.pem (not a path on Home Assistant).
# The file must exist and be readable; there is no certificate-verification bypass.
ca_file =
# Provision a dedicated read-only account for electric-meter-ir/# on the broker.
username = venus-grid-meter
password = CHANGE_ME
topic_prefix = electric-meter-ir
keepalive = 60

[grid_meter]
service_name = com.victronenergy.grid.mqtt_ir_grid_meter
device_instance = 40
product_name = MQTT IR Grid Meter
custom_name = Electric Meter IR
# Each live AC value expires independently; stale total power also disconnects the meter.
stale_seconds = 20

# Victron grid meter convention is usually positive import, negative export.
# Set to -1 if the Cerbo shows import/export reversed.
power_multiplier = 1

# Optional MQTT topic -> D-Bus path mappings. Each [mapping.*] section needs
# topic (full topic under topic_prefix), dbus_path (a registered grid meter path)
# and converter (float, or power to apply power_multiplier). When no [mapping.*]
# section exists, the standard electric_meter_ir sensor topics shown below are
# assumed. Duplicate topics are rejected. See DEFAULT_MAPPINGS in
# mqtt_grid_meter.py for the complete built-in list.
#
#[mapping.active_power]
#topic = electric-meter-ir/sensor/active_power/state
#dbus_path = /Ac/Power
#converter = power
